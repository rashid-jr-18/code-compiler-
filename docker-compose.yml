version: '3.8'

services:
  # ============================================================================
  # Container 1: Piston Code Execution Engine
  # Docker Hub: rashid18/codepiston:latest
  # ============================================================================
  piston:
    image: rashid18/codepiston:latest
    build:
      context: .
      dockerfile: Dockerfile.piston
    container_name: piston_api
    restart: always
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - ./data/piston/packages:/piston/packages
    tmpfs:
      - /tmp
    networks:
      - compiler_net

  # ============================================================================
  # Auto-Bundle Language Installer (Runs once to ensure languages are ready)
  # ============================================================================
  piston-bundle-installer:
    image: curlimages/curl:latest
    container_name: piston_bundle_installer
    restart: "no"
    depends_on:
      - piston
    networks:
      - compiler_net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[Piston Bundle] Waiting for Piston engine to initialize..."
        until curl -s http://piston:2000/api/v2/packages > /dev/null; do
          sleep 2
        done
        echo "[Piston Bundle] Piston is UP! Auto-installing bundled languages..."
        for LANG in python node gcc typescript java sqlite3 bash go rust; do
          echo "[Piston Bundle] Bundling language: $${LANG}..."
          curl -s -X POST http://piston:2000/api/v2/packages \
            -H "Content-Type: application/json" \
            -d "{\"language\":\"$${LANG}\"}" > /dev/null || true
        done
        echo "[Piston Bundle] ✓ All essential languages are bundled and ready!"

  # ============================================================================
  # Container 2: EduTech Next.js App
  # Docker Hub: rashid18/codecompiler:latest
  # ============================================================================
  next-app:
    image: rashid18/codecompiler:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edutech_next_app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Internal Docker DNS: Next.js connects directly to Piston container
      - PISTON_API_URL=http://piston:2000/api/v2
      # External Database URL (set in your .env file)
      - DATABASE_URL=${DATABASE_URL}
      # Brightspace LTI 1.3 / App Config
      - APP_BASE_URL=${APP_BASE_URL}
      - LTI_CLIENT_ID=${LTI_CLIENT_ID}
      - LTI_DEPLOYMENT_ID=${LTI_DEPLOYMENT_ID}
      - LTI_TOKEN_URL=${LTI_TOKEN_URL}
      - LTI_KEYSET_URL=${LTI_KEYSET_URL}
      - LTI_LOGIN_URL=${LTI_LOGIN_URL}
      - LTI_TOOL_PRIVATE_KEY=${LTI_TOOL_PRIVATE_KEY}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - piston
    networks:
      - compiler_net

networks:
  compiler_net:
    driver: bridge
